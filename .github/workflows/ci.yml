name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt httpx
      - name: Run API regression tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check static/browser_collector.js
          node --check static/obsidian.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.in_script = True

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)

          parser = ScriptExtractor()
          parser.feed(Path("static/index.html").read_text(encoding="utf-8"))
          Path("/tmp/huevo-dashboard.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/huevo-dashboard.js
      - name: Build Docker image
        run: docker build -t huevo-gift-analytics:test .
