name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate published snapshot and migration helpers
        run: |
          python -m unittest discover -s tests -p 'test_snapshot.py' -v
          python - <<'PY'
          import json, sys
          import snapshot
          with open("cloudflare-site/data.json", encoding="utf-8") as handle:
              data = json.load(handle)
          problems = snapshot.validate(snapshot.migrate(data))
          if problems:
              print("data.json is not publishable:", *problems[:10], sep="\\n  ", file=sys.stderr)
              sys.exit(1)
          print("data.json OK:", len(data.get("lots", [])), "lots")
          PY

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check current Cloudflare code and configuration
        run: |
          npm run check
          python3 -m json.tool cloudflare-site/data.json > /dev/null
          python3 -m json.tool wrangler.jsonc > /dev/null
      - name: Install browser tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test dashboard, signed launch and Worker
        run: npm run test:e2e
