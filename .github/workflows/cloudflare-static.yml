name: Huevo collector and Cloudflare deploy

on:
  schedule:
    # GitHub Actions uses UTC. Keep the crawl interval conservative to reduce load on Huevo.
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "cloudflare-site/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huevo-cloudflare-collector-deploy
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect all Huevo market pages
        env:
          HUEVO_COOKIES_JSON: ${{ secrets.HUEVO_COOKIES_JSON }}
          HUEVO_COOKIES: ${{ secrets.HUEVO_COOKIES }}
          HUEVO_USER_AGENT: ${{ secrets.HUEVO_USER_AGENT }}
          CRAWL_DELAY: "2"
          MAX_PAGES: "500"
        run: python scripts/collect_snapshot.py

      - name: Commit updated public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-site/data.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; nothing to commit."
          else
            git commit -m "chore: refresh Huevo market snapshot [skip ci]"
            git push origin HEAD:main
          fi

  deploy:
    if: ${{ always() && (github.event_name == 'push' || needs.collect.result == 'success') }}
    needs: [collect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate published data.json structure
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          import snapshot
          with open("cloudflare-site/data.json", encoding="utf-8") as handle:
              data = json.load(handle)
          problems = snapshot.validate(snapshot.migrate(data))
          if problems:
              print("data.json is not publishable:", *problems[:10], sep="\n  ", file=sys.stderr)
              sys.exit(1)
          print("data.json OK:", len(data.get("lots", [])), "lots, schema", data.get("schema_version"))
          PY

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub secrets." >&2
            exit 1
          fi

      - name: Deploy dashboard and snapshot to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy --config wrangler.jsonc
