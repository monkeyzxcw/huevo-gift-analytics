name: AMNYAM Cloudflare deploy

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-site/**"
      - "src/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "snapshot.py"
      - ".github/workflows/cloudflare-static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amnyam-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate published data.json structure
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          import snapshot
          with open("cloudflare-site/data.json", encoding="utf-8") as handle:
              data = json.load(handle)
          problems = snapshot.validate(snapshot.migrate(data))
          if problems:
              print("data.json is not publishable:", *problems[:10], sep="\n  ", file=sys.stderr)
              sys.exit(1)
          print("data.json OK:", len(data.get("lots", [])), "lots, schema", data.get("schema_version"))
          PY

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub secrets." >&2
            exit 1
          fi

      - name: Apply D1 migrations when the database is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HAS_D1="$(python3 - <<'PY'
          import json
          cfg=json.load(open("wrangler.jsonc", encoding="utf-8"))
          rows=cfg.get("d1_databases", [])
          print("yes" if any(x.get("binding") == "DB" and x.get("database_id") for x in rows) else "no")
          PY
          )"
          if [ "$HAS_D1" != "yes" ]; then
            echo "D1 binding DB is required for multi-user accounts; refusing to deploy without it." >&2
            exit 1
          fi
          npx --yes wrangler@4 d1 migrations apply huevo-live-data --remote --config wrangler.jsonc
          echo "D1 migrations applied."

      - name: Deploy dashboard and snapshot to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Smoke-test deployed Worker, D1, and published snapshot
        env:
          WORKER_URL: https://huevo-gift-analytics.monkeyzxc1437.workers.dev
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          base = os.environ["WORKER_URL"].rstrip("/")
          last_error = None

          def get_json(path):
              request = Request(base + path, headers={"Accept": "application/json", "Cache-Control": "no-cache"})
              with urlopen(request, timeout=12) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path}: HTTP {response.status}")
                  value = json.loads(response.read().decode("utf-8"))
              if not isinstance(value, dict):
                  raise RuntimeError(f"{path}: expected a JSON object")
              return value

          for attempt in range(1, 9):
              try:
                  health = get_json("/api/health")
                  live = get_json("/api/live/status")
                  snapshot = get_json("/data.json")
                  checks = {
                      "health_ok": health.get("ok") is True,
                      "d1_configured": health.get("storage_configured") is True,
                      "schema_ready": health.get("schema_ready") is True,
                      "ingest_secret_configured": health.get("ingest_enabled") is True,
                      "live_endpoint_ready": live.get("enabled") is True and live.get("schema_ready") is True,
                      "snapshot_has_lots": isinstance(snapshot.get("lots"), list) and len(snapshot["lots"]) > 0,
                      "snapshot_timestamp_present": isinstance(snapshot.get("generated_at"), str) and bool(snapshot["generated_at"]),
                  }
                  if not all(checks.values()):
                      raise RuntimeError("post-deploy checks failed: " + ", ".join(k for k, ok in checks.items() if not ok))
                  print("Production smoke check passed:", json.dumps({
                      "worker": base,
                      "checks": checks,
                      "snapshot_lots": len(snapshot["lots"]),
                      "snapshot_generated_at": snapshot.get("generated_at"),
                      "live_fresh": live.get("fresh"),
                      "live_last_poll_at": live.get("last_poll_at"),
                      "live_item_count": live.get("item_count"),
                  }, ensure_ascii=False))
                  if not live.get("fresh"):
                      print("NOTE: Worker and D1 are healthy, but the local HuevoDualScan collector has not reported fresh Live data.")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Post-deploy smoke attempt {attempt}/8 failed: {type(exc).__name__}: {exc}")
                  if attempt < 8:
                      time.sleep(5)
          else:
              raise SystemExit(f"Production smoke check failed after retries: {last_error}")
          PY
