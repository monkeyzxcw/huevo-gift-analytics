name: Huevo cloud collector and Cloudflare deploy

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "cloudflare-site/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huevo-cloud-collector-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # The scheduled/manual run already deploys its snapshot. Avoid a second deploy
    # when that run pushes its generated data.json commit back to main.
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: refresh Huevo market snapshot')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect all Huevo market pages
        env:
          HUEVO_COOKIES_JSON: ${{ secrets.HUEVO_COOKIES_JSON }}
          HUEVO_COOKIES: ${{ secrets.HUEVO_COOKIES }}
          HUEVO_USER_AGENT: ${{ secrets.HUEVO_USER_AGENT }}
          CRAWL_DELAY: "2"
          MAX_PAGES: "500"
        run: python scripts/collect_snapshot.py

      - name: Validate collected snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('cloudflare-site/data.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data.get('lots'), list) or not data['lots']:
              raise SystemExit('Snapshot validation failed: lots must be a non-empty list')
          if not data.get('generated_at'):
              raise SystemExit('Snapshot validation failed: generated_at is missing')
          collector = data.get('collector') or {}
          if collector.get('status') != 'ok':
              raise SystemExit('Snapshot validation failed: collector status is not ok')
          forbidden = {'cookie', 'cookies', 'authorization', 'token', 'session', 'password'}
          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if any(word in str(key).lower() for word in forbidden):
                          raise SystemExit(f'Snapshot validation failed: sensitive field at {path}.{key}')
                      walk(item, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      walk(item, f'{path}[{index}]')
          walk(data)
          print(f"Validated {len(data['lots'])} lots; generated_at={data['generated_at']}")
          PY

      - name: Commit updated public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-site/data.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; nothing to commit."
          else
            git commit -m "chore: refresh Huevo market snapshot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub secrets." >&2
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy dashboard and snapshot to Cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
