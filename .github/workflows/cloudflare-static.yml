name: Huevo collector and Cloudflare deploy

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "cloudflare-site/**"
      - "src/**"
      - "migrations/**"
      - "scripts/poll_first_page.py"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huevo-cloudflare-collector-deploy
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      persistence_mode: ${{ steps.persist.outputs.mode }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect all Huevo market pages
        id: collect
        env:
          HUEVO_COOKIES_JSON: ${{ secrets.HUEVO_COOKIES_JSON }}
          HUEVO_COOKIES: ${{ secrets.HUEVO_COOKIES }}
          HUEVO_USER_AGENT: ${{ secrets.HUEVO_USER_AGENT }}
          CRAWL_DELAY: "2"
          MAX_PAGES: "500"
        run: python scripts/collect_snapshot.py

      # When D1 is enabled, write the whole snapshot to Cloudflare storage and avoid
      # one data.json Git commit every ten minutes. Until D1 + token are configured, fall back
      # to the safe Git snapshot workflow so the live site keeps working.
      - name: Publish snapshot to Cloudflare storage or commit fallback
        id: persist
        if: always()
        env:
          HUEVO_LIVE_INGEST_TOKEN: ${{ secrets.HUEVO_LIVE_INGEST_TOKEN }}
          HUEVO_WORKER_URL: https://huevo-gift-analytics.monkeyzxc1437.workers.dev
        run: |
          if [ -n "$HUEVO_LIVE_INGEST_TOKEN" ] && [ -f cloudflare-site/data.json ]; then
            HEALTH="$(curl -fsS --max-time 10 "$HUEVO_WORKER_URL/api/health" || true)"
            if printf '%s' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("storage_configured") and d.get("schema_ready") and d.get("ingest_enabled") else 1)' 2>/dev/null; then
              curl --fail --silent --show-error --max-time 30 \
                -X POST "$HUEVO_WORKER_URL/api/snapshot" \
                -H "Authorization: Bearer $HUEVO_LIVE_INGEST_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @cloudflare-site/data.json
              echo "Snapshot stored in Cloudflare D1; no data.json commit created."
              echo "mode=live" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-site/data.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; nothing to commit."
          else
            git commit -m "chore: refresh Huevo market snapshot [skip ci]"
            git push origin HEAD:main
          fi
          echo "mode=static" >> "$GITHUB_OUTPUT"

  deploy:
    if: ${{ always() && (github.event_name == 'push' || (needs.collect.result != 'skipped' && needs.collect.outputs.persistence_mode != 'live')) }}
    needs: [collect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate published data.json structure
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          import snapshot
          with open("cloudflare-site/data.json", encoding="utf-8") as handle:
              data = json.load(handle)
          problems = snapshot.validate(snapshot.migrate(data))
          if problems:
              print("data.json is not publishable:", *problems[:10], sep="\n  ", file=sys.stderr)
              sys.exit(1)
          print("data.json OK:", len(data.get("lots", [])), "lots, schema", data.get("schema_version"))
          PY

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub secrets." >&2
            exit 1
          fi

      - name: Apply D1 migrations when the database is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HAS_D1="$(python3 - <<'PY'
          import json
          cfg=json.load(open("wrangler.jsonc", encoding="utf-8"))
          rows=cfg.get("d1_databases", [])
          print("yes" if any(x.get("binding") == "DB" and x.get("database_id") for x in rows) else "no")
          PY
          )"
          if [ "$HAS_D1" != "yes" ]; then
            echo "D1 binding DB is required for multi-user accounts; refusing to deploy without it." >&2
            exit 1
          fi
          npx --yes wrangler@4 d1 migrations apply huevo-live-data --remote --config wrangler.jsonc
          echo "D1 migrations applied."

      - name: Deploy dashboard and snapshot to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy --config wrangler.jsonc
