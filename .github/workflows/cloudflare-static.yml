name: Huevo cloud collector and Cloudflare deploy

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "cloudflare-site/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huevo-cloud-collector-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        if: github.event_name != 'push'
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        if: github.event_name != 'push'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect all Huevo market pages
        if: github.event_name != 'push'
        env:
          HUEVO_COOKIES_JSON: ${{ secrets.HUEVO_COOKIES_JSON }}
          HUEVO_COOKIES: ${{ secrets.HUEVO_COOKIES }}
          HUEVO_USER_AGENT: ${{ secrets.HUEVO_USER_AGENT }}
          CRAWL_DELAY: "2"
          MAX_PAGES: "500"
        run: python scripts/collect_snapshot.py

      - name: Commit updated public snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-site/data.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; nothing to commit."
          else
            git commit -m "chore: refresh Huevo market snapshot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E -e 's/^[[:space:]]*Bearer[[:space:]]+//I' -e 's/^[[:space:]]+|[[:space:]]+$//g' -e 's/^"//' -e 's/"$//')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub secrets." >&2
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy dashboard and snapshot to Cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
