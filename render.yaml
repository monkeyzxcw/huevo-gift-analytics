services:
  - type: web
    name: huevo-gift-analytics
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HUEVO_DB
        value: huevo.db
      - key: CRAWL_DELAY
        value: "2.0"
      - key: MAX_PAGES
        value: "500"
      - key: AUTO_CRAWL
        value: "true"
      - key: AUTO_CRAWL_MINUTES
        value: "60"
