services:
  - type: web
    name: huevo-gift-analytics
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HUEVO_DB
        value: huevo.db
      - key: INGEST_TOKEN
        generateValue: true
      - key: CRAWL_DELAY
        value: "2.2"
      - key: MAX_PAGES
        value: "500"
