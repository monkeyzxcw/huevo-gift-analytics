services:
  - type: web
    name: huevo-gift-analytics
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Free plan: the disk is EPHEMERAL, huevo.db is lost on every deploy/restart.
      # For durable history attach a persistent disk (paid; NOT enabled automatically):
      #   disk: {name: data, mountPath: /var/data, sizeGB: 1}   (service-level key)
      # and then set HUEVO_DB to /var/data/huevo.db.
      - key: HUEVO_DB
        value: huevo.db
      - key: HUEVO_BASE_URL
        value: https://huevo.su
      - key: INGEST_TOKEN
        generateValue: true
      - key: CRAWL_DELAY
        value: "2.0"
      - key: CRAWL_BLOCK_COOLDOWN_HOURS
        value: "6"
      - key: MAX_PAGES
        value: "500"
      - key: AUTO_REFRESH_HOURS
        value: "2"
      # Secrets: set the values in Render -> Environment (never in git).
      - key: HUEVO_CLIENT_ID
        sync: false
      - key: HUEVO_CLIENT_SECRET
        sync: false
