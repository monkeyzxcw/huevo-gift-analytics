services:
  - type: web
    name: huevo-gift-analytics
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HUEVO_DB
        value: huevo.db
      - key: HUEVO_BASE_URL
        value: https://huevo.su
      - key: INGEST_TOKEN
        generateValue: true
      - key: CRAWL_DELAY
        value: "2.0"
      - key: CRAWL_BLOCK_COOLDOWN_HOURS
        value: "6"
      - key: MAX_PAGES
        value: "500"
      - key: AUTO_REFRESH_HOURS
        value: "2"
