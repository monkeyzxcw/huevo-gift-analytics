services:
  huevo-gift-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    image: huevo-gift-analytics:latest
    container_name: huevo-gift-analytics
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: "8000"
      HUEVO_DB: /data/huevo.db
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - huevo_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s

volumes:
  huevo_data:
    name: huevo-gift-analytics-data
